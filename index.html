<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIAMOND SCOREBOOK PRO</title>
<meta name="description" content="iPhone 向け野球スコアブックアプリ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: 1カラムの読み物ページ。アプリと同じ濃紺の地に金のアクセント(単一ダークテーマ) */
:root{--bg:#0B0E13;--panel:#131821;--line:#232a35;--ink:#F4F6F9;--sub:#A3ADBB;--gold:#fbbf24;--gold2:#ca8a04;
  --disp:'Oswald',"Hiragino Sans",sans-serif;--body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.85 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{font:700 13px/1 var(--disp);letter-spacing:4px;color:var(--sub);text-decoration:none}
.brand b{color:var(--gold);font-weight:700}
h1{font:700 24px/1.4 var(--body);margin:0;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:14px}
section{display:flex;flex-direction:column;gap:10px}
h2{font:700 17px/1.5 var(--body);margin:0;padding-left:12px;border-left:3px solid var(--gold)}
p{margin:0}
ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
a{color:var(--gold);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.svc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.svc h3{margin:0;font-size:15px}
.svc p{font-size:14px;color:var(--sub)}
.svc p.ink{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;align-self:flex-start;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1205;
  font:700 15px/1 var(--body);text-decoration:none;padding:14px 22px;border-radius:10px}
.note{font-size:13px;color:var(--sub)}
.qa{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.qa h3{margin:0;font-size:15px;line-height:1.6}
.qa h3::before{content:"Q. ";color:var(--gold);font-family:var(--disp)}
.qa p::before{content:"A. ";color:var(--sub);font-family:var(--disp)}
.links{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.card b{font-size:16px}
.card span{font-size:13px;color:var(--sub)}
.card:hover{border-color:var(--gold2)}
footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 16px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="./">DIAMOND SCOREBOOK <b>PRO</b></a><h1>DIAMOND SCOREBOOK PRO</h1><p class="lead">iPhone 向け野球スコアブックアプリ</p></header>
<section><p>DIAMOND SCOREBOOK PRO は、全日本野球協会（BFJ）推奨の記法に沿って試合を記録できる iPhone 向けの野球スコアブックアプリです。</p>
<a class="btn" href="https://apps.apple.com/jp/app/diamond-scorebook-pro/id6816465707">App Store でダウンロード</a>
<p class="note">iPhone 用・無料（3試合まで無料、PRO+ は買い切りのアプリ内課金）</p></section>

</div>
</body>
</html>
